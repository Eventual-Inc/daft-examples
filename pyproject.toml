[project]
name = "daft-examples"
version = "0.1.0"
description = "Daft Examples"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "daft>=0.7.17",
    "daft-h3",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "pipelines", "datasets/egodex"]

[project.optional-dependencies]
test = [
    "h5py>=3.0.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
]
lint = [
    "ruff>=0.9.0",
]
lakehouse = [
    "daft[iceberg,sql]>=0.7.17",
    "pyiceberg[sql-sqlite,gcsfs,bigquery,s3fs,glue]",
    "matplotlib",
    "sqlalchemy-bigquery",
]
# Driver-side deps for models/ and the pipelines that compose them.
# Heavy inference stacks (vllm, torch, nemo, ...) live in each modal_app.py image.
models = [
    "faster-whisper",
    "huggingface_hub",
    "modal",
    "pillow",
]
# Local helpers for the transcribe+diarize benchmark (metrics + entrypoints).
# The GPU inference stacks (nemo, pyannote, ctranslate2) live in the lane images.
transcription = [
    "modal",
    "huggingface_hub",
    "soundfile",
    "jiwer",
]

[tool.ruff]
target-version = "py312"
line-length = 90

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E712",   # true-false comparison (daft filter pattern: col("x") == True)
    "E741",   # ambiguous variable name
    "B005",   # strip with multi-characters (intentional in examples)
    "B006",   # mutable default arg (daft UDF pattern)
    "B008",   # function call in default arg (daft UDF pattern)
    "B905",   # zip without strict (examples don't need strict)
    "SIM105", # suppressible exception (explicit try/except is clearer in examples)
    "SIM211", # if-expr with false-true (readability over cleverness)
    "UP042",  # replace str enum (not worth changing in examples)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F821", "E402"]  # cross-cell refs and imports
"pipelines/social_recommendation/reddit.ipynb" = ["F821"]
"pipelines/context_engineering/lambda_mapreduce_pdf_iceberg.py" = ["F821"]  # pyiceberg referenced in comment-like code
"pipelines/context_engineering/context_kernel_demo.py" = ["E402"]  # sys.path hack before import
"models/faster_whisper/model.py" = ["E402"]           # PEP 723 script keeps repo-root sys.path anchor
"models/sam3d_body/model.py" = ["E402"]               # PEP 723 script keeps repo-root sys.path anchor
"pipelines/voice_ai_analytics/voice_ai_analytics.py" = ["E402"]  # PEP 723 script keeps repo-root sys.path anchor
"pipelines/voice_ai_analytics/voice_ai_tutorial.py" = ["E402"]   # PEP 723 script keeps repo-root sys.path anchor
"models/parakeet/model.py" = ["E402"]                  # repo-root sys.path anchor before models.* imports
"models/sortformer/model.py" = ["E402"]                # repo-root sys.path anchor before models.* imports
"models/pyannote/model.py" = ["E402"]                  # repo-root sys.path anchor before models.* imports
"models/faster_whisper/asr.py" = ["E402"]              # repo-root sys.path anchor before models.* imports
"pipelines/transcribe_diarize/pipeline.py" = ["E402"]  # repo-root sys.path anchor before models.* imports
"pipelines/transcribe_diarize/benchmark.py" = ["E402"] # repo-root sys.path anchor before pipelines.* imports
"pipelines/transcribe_diarize/modal_app.py" = ["E402"] # PEP 723 script keeps repo-root sys.path anchor

[tool.ruff.lint.isort]
known-first-party = ["daft", "egodex", "models", "pipelines"]

[tool.ty.rules]
# Daft stubs type col("x") == value as bool, but filter/where take Expression at runtime.
# Same Daft filter pattern as the Ruff E712 ignore above.
invalid-argument-type = "ignore"
