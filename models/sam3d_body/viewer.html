<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM 3D Body Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151719;
        --panel: rgba(22, 24, 26, 0.88);
        --line: rgba(255, 255, 255, 0.16);
        --text: #f3f4f6;
        --muted: #aeb6bf;
        --accent: #73c7a7;
        --warn: #f4b95e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .toolbar {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .cluster {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(14px);
        padding: 8px;
      }

      .title {
        min-width: 0;
        padding: 0 8px;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
      }

      button {
        height: 34px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        pointer-events: auto;
      }

      button:hover {
        border-color: rgba(115, 199, 167, 0.7);
        background: rgba(115, 199, 167, 0.16);
      }

      button.active {
        color: #07110d;
        border-color: var(--accent);
        background: var(--accent);
      }

      input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .status {
        position: fixed;
        left: 14px;
        bottom: 14px;
        max-width: min(640px, calc(100vw - 28px));
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(14px);
        padding: 9px 11px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }

      .status.warn {
        color: var(--warn);
      }

      @media (max-width: 720px) {
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .cluster {
          justify-content: space-between;
          width: 100%;
        }

        .title {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage"></main>
    <div class="toolbar">
      <div class="cluster">
        <button id="openButton" type="button">Open PLY</button>
        <input id="fileInput" type="file" accept=".ply,model/ply" />
        <div id="modelTitle" class="title">SAM 3D Body Viewer</div>
      </div>
      <div class="cluster">
        <button id="wireButton" type="button">Wire</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </div>
    <div id="status" class="status">Loading</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { PLYLoader } from "three/addons/loaders/PLYLoader.js";

      const stage = document.querySelector("#stage");
      const statusEl = document.querySelector("#status");
      const titleEl = document.querySelector("#modelTitle");
      const fileInput = document.querySelector("#fileInput");
      const openButton = document.querySelector("#openButton");
      const wireButton = document.querySelector("#wireButton");
      const resetButton = document.querySelector("#resetButton");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x151719);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 1000);
      camera.position.set(0, 1.4, 4.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      stage.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(3, 4, 5);
      scene.add(key);
      scene.add(new THREE.HemisphereLight(0xc9e8ff, 0x2d3338, 1.8));

      const grid = new THREE.GridHelper(3, 30, 0x52606a, 0x30363b);
      grid.material.opacity = 0.34;
      grid.material.transparent = true;
      scene.add(grid);

      const loader = new PLYLoader();
      let mesh = null;
      let lastFit = null;

      function setStatus(message, warn = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("warn", warn);
      }

      function degreesParam(name) {
        const value = Number(new URLSearchParams(window.location.search).get(name));
        return Number.isFinite(value) ? (value * Math.PI) / 180 : 0;
      }

      function disposeCurrentMesh() {
        if (!mesh) return;
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
        mesh = null;
      }

      function fitCamera(object) {
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z) * 0.72 || 1;
        const distance = radius / Math.sin((camera.fov * Math.PI) / 360);

        controls.target.copy(center);
        camera.near = Math.max(distance / 1000, 0.001);
        camera.far = distance * 1000;
        camera.position.set(center.x, center.y + radius * 0.2, center.z + distance * 1.08);
        camera.updateProjectionMatrix();
        controls.update();

        grid.position.y = box.min.y;
        grid.scale.setScalar(Math.max(radius, 1));
        lastFit = { center, radius, distance };
      }

      function loadGeometry(geometry, label) {
        disposeCurrentMesh();
        geometry.computeVertexNormals();
        geometry.center();

        const material = new THREE.MeshStandardMaterial({
          color: 0xd6ecff,
          roughness: 0.58,
          metalness: 0.03,
          vertexColors: geometry.hasAttribute("color"),
          side: THREE.DoubleSide,
        });

        mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.set(degreesParam("rx"), degreesParam("ry"), degreesParam("rz"));
        scene.add(mesh);
        fitCamera(mesh);
        titleEl.textContent = label;
        setStatus(label);
      }

      async function loadUrl(url) {
        setStatus(`Loading ${url}`);
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        const buffer = await response.arrayBuffer();
        loadGeometry(loader.parse(buffer), url.split("/").pop() || url);
      }

      function loadFile(file) {
        setStatus(`Loading ${file.name}`);
        const reader = new FileReader();
        reader.onload = () => loadGeometry(loader.parse(reader.result), file.name);
        reader.onerror = () => setStatus(`Could not read ${file.name}`, true);
        reader.readAsArrayBuffer(file);
      }

      openButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files?.[0];
        if (file) loadFile(file);
      });

      wireButton.addEventListener("click", () => {
        if (!mesh) return;
        mesh.material.wireframe = !mesh.material.wireframe;
        wireButton.classList.toggle("active", mesh.material.wireframe);
      });

      resetButton.addEventListener("click", () => {
        if (!mesh || !lastFit) return;
        fitCamera(mesh);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      const params = new URLSearchParams(window.location.search);
      const modelUrl = params.get("model");
      if (modelUrl) {
        loadUrl(modelUrl).catch((error) => setStatus(`Load failed: ${error.message}`, true));
      } else {
        setStatus("Open a PLY file");
      }
    </script>
  </body>
</html>
